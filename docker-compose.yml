services:
  # Test mode - Service for merging orders with products (Step 1)
  orders-merge-test:
    build:
      context: .
      dockerfile: Dockerfile.merge
    volumes:
      - ./datasource:/app/datasource
      - ./order-line-items-with-product-codes:/app/order-line-items-with-product-codes
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python merge_orders_products_optimized.py --test

  # Production mode - Service for merging orders with products (Step 1)
  orders-merge-prod:
    build:
      context: .
      dockerfile: Dockerfile.merge
    volumes:
      - ./datasource:/app/datasource
      - ./order-line-items-with-product-codes:/app/order-line-items-with-product-codes
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
      - ORDERS_FILE=${ORDERS_FILE}
      - REGION_NAME=${REGION_NAME}
    command: >
      sh -c "
        if [ -n \"$$ORDERS_FILE\" ]; then
          python merge_orders_products_optimized.py --orders-file $$ORDERS_FILE
        elif [ -n \"$$REGION_NAME\" ]; then
          python merge_orders_products_optimized.py --region $$REGION_NAME
        else
          echo 'Error: Either ORDERS_FILE or REGION_NAME environment variable must be set for production mode'
          exit 1
        fi
      "

  # Test mode - Service for converting orders to Matrixify format (Step 2)
  orders-matrixify-test:
    build:
      context: .
      dockerfile: Dockerfile.matrixify
    volumes:
      - ./order-line-items-with-product-codes:/app/order-line-items-with-product-codes
      - ./matrixify-ready-orders:/app/matrixify-ready-orders
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python orders_to_matrixify.py --test

  # Production mode - Service for converting orders to Matrixify format (Step 2)
  orders-matrixify-prod:
    build:
      context: .
      dockerfile: Dockerfile.matrixify
    volumes:
      - ./order-line-items-with-product-codes:/app/order-line-items-with-product-codes
      - ./matrixify-ready-orders:/app/matrixify-ready-orders
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
      - ORDERS_FILE=${ORDERS_FILE}
      - REGION_NAME=${REGION_NAME}
    command: >
      sh -c "
        if [ -n \"$$ORDERS_FILE\" ]; then
          python orders_to_matrixify.py --orders-file $$ORDERS_FILE
        elif [ -n \"$$REGION_NAME\" ]; then
          python orders_to_matrixify.py --region $$REGION_NAME
        else
          python orders_to_matrixify.py
        fi
      "

  # Test mode - Combined orders pipeline service that runs both steps sequentially
  orders-pipeline-test:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - ./datasource:/app/datasource
      - ./order-line-items-with-product-codes:/app/order-line-items-with-product-codes
      - ./matrixify-ready-orders:/app/matrixify-ready-orders
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: sh -c "python merge_orders_products_optimized.py --test && python orders_to_matrixify.py --test"

  # Production mode - Combined orders pipeline service that runs both steps sequentially
  orders-pipeline-prod:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    volumes:
      - ./datasource:/app/datasource
      - ./order-line-items-with-product-codes:/app/order-line-items-with-product-codes
      - ./matrixify-ready-orders:/app/matrixify-ready-orders
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
      - ORDERS_FILE=${ORDERS_FILE}
      - REGION_NAME=${REGION_NAME}
    command: >
      sh -c "
        if [ -n \"$$ORDERS_FILE\" ]; then
          echo 'Running with ORDERS_FILE: '$$ORDERS_FILE
          python merge_orders_products_optimized.py --orders-file $$ORDERS_FILE && python orders_to_matrixify.py --orders-file $$ORDERS_FILE
        elif [ -n \"$$REGION_NAME\" ]; then
          echo 'Running with REGION_NAME: '$$REGION_NAME
          python merge_orders_products_optimized.py --region $$REGION_NAME && python orders_to_matrixify.py --region $$REGION_NAME
        else
          echo 'Error: Either ORDERS_FILE or REGION_NAME environment variable must be set for production mode'
          exit 1
        fi
      "

  # Test mode - Service for processing products to Matrixify format
  products-matrixify-test:
    build:
      context: .
      dockerfile: Dockerfile.products
    volumes:
      - ./datasource:/app/datasource
      - ./matrixify-ready-products:/app/matrixify-ready-products
      - ./processed:/app/processed
      - ./error-rows:/app/error-rows
      - ./logs:/app/logs
      - ./import-results:/app/import-results
      - ./error-analysis:/app/error-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python products_to_matrixify.py --test

  # Production mode - Service for processing products to Matrixify format
  products-matrixify-prod:
    build:
      context: .
      dockerfile: Dockerfile.products
    volumes:
      - ./datasource:/app/datasource
      - ./matrixify-ready-products:/app/matrixify-ready-products
      - ./processed:/app/processed
      - ./error-rows:/app/error-rows
      - ./logs:/app/logs
      - ./import-results:/app/import-results
      - ./error-analysis:/app/error-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python products_to_matrixify.py

  # Service for analyzing import errors only
  analyze-import-errors:
    build:
      context: .
      dockerfile: Dockerfile.products
    volumes:
      - ./import-results:/app/import-results
      - ./error-analysis:/app/error-analysis
      - ./logs:/app/logs
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python products_to_matrixify.py --analyze-errors

  # Legacy Error Analysis Service (kept for backward compatibility)
  error-analysis:
    build:
      context: .
      dockerfile: Dockerfile.error-analysis
    volumes:
      - ./import-results:/app/import-results
      - ./error-analysis:/app/error-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python analyze_import_errors.py

  # Pattern Analysis Services
  # Service for generating product name pattern examples
  generate-pattern-examples:
    build:
      context: .
      dockerfile: Dockerfile.pattern-analysis
    volumes:
      - ./pattern-analysis:/app/pattern-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python generate_pattern_examples.py

  # Service for validating pattern examples against actual function
  validate-pattern-examples:
    build:
      context: .
      dockerfile: Dockerfile.pattern-analysis
    volumes:
      - ./pattern-analysis:/app/pattern-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: python validate_pattern_examples.py

  # Service for custom product name testing
  test-custom-names:
    build:
      context: .
      dockerfile: Dockerfile.pattern-analysis
    volumes:
      - ./pattern-analysis:/app/pattern-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
      - CUSTOM_NAMES=${CUSTOM_NAMES}
    command: >
      sh -c "
        if [ -n \"$$CUSTOM_NAMES\" ]; then
          echo \"Testing custom names: $$CUSTOM_NAMES\"
          python validate_pattern_examples.py --custom-names \"$$CUSTOM_NAMES\"
        else
          echo 'Usage: docker compose run --rm -e CUSTOM_NAMES=\"Product 1 Product 2\" test-custom-names'
          echo 'Example: docker compose run --rm -e CUSTOM_NAMES=\"Kong Dog Toy 2-Pack Hills Diet 5 lb\" test-custom-names'
          echo ''
          echo 'Note: Separate multiple product names with spaces in a single quoted string'
          exit 1
        fi
      "

  # Complete pattern analysis pipeline (generate + validate)
  pattern-analysis-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pattern-analysis
    volumes:
      - ./pattern-analysis:/app/pattern-analysis
      - .:/app:ro # Bind mount scripts for development
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "
        echo '🔍 Starting Pattern Analysis Pipeline...'
        echo '📋 Step 1: Generating pattern examples...'
        python generate_pattern_examples.py &&
        echo '✅ Pattern examples generated successfully!' &&
        echo '📋 Step 2: Validating examples against actual function...' &&
        python validate_pattern_examples.py &&
        echo '🎉 Pattern analysis pipeline completed successfully!'
      "

volumes:
  order_line_items:
  matrixify_orders:
  matrixify_products:
  processed_data:
  logs_data:
